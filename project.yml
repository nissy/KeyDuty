name: KeyDuty

options:
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "27.1"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: R7LKF73J2W
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

targets:
  KeyDuty:
    type: application
    platform: macOS
    sources:
      - path: KeyDuty
    info:
      path: Config/KeyDuty-Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        SUFeedURL: $(KEYDUTY_UPDATE_FEED_URL)
        SUPublicEDKey: $(KEYDUTY_UPDATE_PUBLIC_KEY)
        SUEnableAutomaticChecks: false
        SUAllowsAutomaticUpdates: false
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nissy.KeyDuty
        PRODUCT_NAME: KeyDuty
        PRODUCT_MODULE_NAME: KeyDuty
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        KEYDUTY_UPDATE_FEED_URL: https://github.com/nissy/KeyDuty/releases/latest/download/appcast.xml
        KEYDUTY_UPDATE_PUBLIC_KEY: 3ULKBosChZ9zwgQ6NtWNIwZFDDiCp5P/lyYM2Yed8g4=
        ENABLE_APP_SANDBOX: NO

  KeyDutyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KeyDutyTests
    dependencies:
      - target: KeyDuty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nissy.KeyDutyTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  KeyDuty:
    build:
      targets:
        KeyDuty: all
        KeyDutyTests: [test]
    test:
      config: Debug
      targets:
        - KeyDutyTests
    run:
      config: Debug
    archive:
      config: Release
